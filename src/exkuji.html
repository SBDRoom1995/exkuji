<title>EXくじ デモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-column mobile app — sticky header with ticket balance, tab panels, fixed bottom nav. Capsule machine is the hero of the ガチャ tab. */
:root{
  /* 夜のゲームセンター：濃紺の床に、青・緑のブランド光と金の景品色 */
  --bg:#070F22; --surface:#111E3D; --surface-2:#0C1731; --ink:#EEF3FC; --muted:#93A3C4; --line:rgba(150,180,255,.15);
  --blue:#3D8BFF; --blue-ink:#FFFFFF; --green:#2BD48A; --green-soft:rgba(43,212,138,.15); --blue-soft:rgba(61,139,255,.16);
  --warn:#FFB547; --warn-soft:rgba(255,181,71,.14); --danger:#FF6B74; --gold:#FFD25A;
  --cap-a:#F2B807; --cap-b:#FF4F8B; --cap-c:#8B6CFF; --cap-d:#2BD48A; --cap-e:#2E9CFF; --cap-l:#E9EEF8;
  --cap-f:#C98A44; --cap-g:#5FA3B4; --cap-h:#C46FD0; --cap-k:#FF9F1C;
  --m-blue:#2F7BFF; --m-blue-2:#1748B0; --m-blue-soft:#0F2350;
  --m-red:#FF4757; --m-red-2:#B3202C; --m-red-soft:#2A0E1A;
  --m-purple:#8B5CF6; --m-purple-2:#5B32C9; --m-purple-soft:#1C1442;
  --m-orange:#FF9F1C; --m-orange-2:#C46A00; --m-orange-soft:#2A1A08;
  --m-green:#22C983; --m-green-2:#0E8A55; --m-green-soft:#0B2A20;
  --m-pink:#FF5FA2; --m-pink-2:#C2185B; --m-pink-soft:#2E0F22;
  --dome:#0F2350; --machine:#2F7BFF; --machine-2:#1748B0;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.display{font-family:var(--display);font-weight:400;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--display);font-size:20px;color:var(--blue);display:flex;align-items:center;gap:6px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--green);display:inline-block}
.bal{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.bal b{font-family:var(--display);font-size:18px;font-weight:400}
.ticket-ico{width:22px;height:14px;border-radius:3px;background:var(--green);position:relative;display:inline-block}
.ticket-ico::before,.ticket-ico::after{content:"";position:absolute;top:4px;width:6px;height:6px;border-radius:50%;background:var(--surface)}
.ticket-ico::before{left:-3px}.ticket-ico::after{right:-3px}
.bal button{border:0;background:var(--blue);color:var(--blue-ink);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}

main{padding-block:16px 110px}
section.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:17px;font-weight:700;margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--blue);color:var(--blue-ink);min-height:44px}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* machine */
.stage{background:linear-gradient(180deg,var(--blue-soft),var(--surface));border:1px solid var(--line);border-radius:20px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;align-items:center;overflow:hidden}
.boxline{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.boxline .display{font-size:15px}
.machine{position:relative;width:220px;max-width:100%}
.dome{position:relative;width:220px;max-width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 12%,transparent 13%),var(--dome);border:6px solid var(--machine);overflow:hidden}
.dome .cap{position:absolute;width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.12);background:linear-gradient(180deg,var(--c) 0 50%,#fff 50%)}
.body{width:180px;height:118px;margin:-14px auto 0;background:var(--machine);border-radius:10px 10px 16px 16px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:inset 0 -8px 0 var(--machine-2)}
.handle{width:58px;height:58px;border-radius:50%;background:#fff;border:5px solid var(--machine-2);position:relative;transition:transform .9s cubic-bezier(.4,1.6,.5,1)}
.handle::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:10px;margin-left:-5px;border-radius:5px;background:var(--machine-2)}
.outlet{width:52px;height:44px;border-radius:10px;background:var(--machine-2);position:relative;overflow:visible}
.outlet .drop{position:absolute;left:50%;top:6px;width:30px;height:30px;margin-left:-15px;border-radius:50%;opacity:0;background:linear-gradient(180deg,var(--c,var(--green)) 0 50%,#fff 50%);border:2px solid rgba(0,0,0,.15)}
.machine.spin .handle{transform:rotate(360deg)}
.machine.spin .dome{animation:shake .5s ease-in-out 2}
.machine.spin .drop{animation:drop .6s .8s ease-out forwards}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}}
@keyframes drop{0%{opacity:0;transform:translateY(-14px)}60%{opacity:1;transform:translateY(8px)}100%{opacity:1;transform:translateY(4px)}}

.progress{width:100%}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:999px;transition:width .6s}
.lastone{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1.5px dashed var(--cap-a);border-radius:12px;padding:10px 12px}
.lastone .cnt{font-family:var(--display);font-size:26px;line-height:1;color:var(--cap-a)}

.pulls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.pull{border:0;border-radius:14px;padding:12px 6px 10px;background:var(--surface);border:2px solid var(--blue);color:var(--blue);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px}
.pull .display{font-size:22px;line-height:1.1}
.pull small{font-size:12px;color:var(--muted)}
.pull.hot{background:var(--blue);color:var(--blue-ink)}
.pull.hot small{color:var(--blue-ink);opacity:.85}

/* odds table */
.odds{width:100%;border-collapse:collapse;font-size:14px}
.odds th,.odds td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.odds th{font-size:12px;color:var(--muted);font-weight:500}
.odds td.r{text-align:right;font-variant-numeric:tabular-nums}
.tier{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-family:var(--display);font-size:13px;background:var(--c);flex:none}
.tier.l{color:var(--bg)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:700}
.reward{font-family:var(--display);color:var(--green);white-space:nowrap}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.held{background:var(--blue-soft);color:var(--blue)}
.pill.req{background:var(--warn-soft);color:var(--warn)}
.pill.ship{background:var(--green-soft);color:var(--green)}
.pill.done{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pack{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pack .display{font-size:20px}
.pack .bonus{font-size:11px;font-weight:700;color:var(--green)}
.gsel{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.gcard{flex:0 0 min(46%,190px);text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.gcard[aria-selected="true"]{border-color:var(--machine);background:var(--dome)}
.gcard .gtop{display:flex;align-items:center;gap:6px;font-size:14px;line-height:1.3}
.gdot{width:12px;height:12px;border-radius:50%;background:var(--machine);flex:none;display:inline-block}
.gbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;display:block}
.gbar i{display:block;height:100%;background:var(--machine)}
.thumbw{position:relative;flex:none;display:inline-block;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.thumbw img{width:100%;height:100%;object-fit:cover;display:block}
.thumbw .rk{position:absolute;left:2px;top:2px;min-width:16px;height:16px;border-radius:8px;background:var(--c);color:#fff;font:400 10px/16px var(--display);text-align:center;padding:0 3px}
.show{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:440px){.show{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sh{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.sh img,.sh .ph{width:100%;max-width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;display:block}
.sh .ph{display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--surface-2));color:var(--c);font-family:var(--display);font-size:15px;text-align:center;line-height:1.2;border:1.5px dashed color-mix(in srgb,var(--c) 45%,transparent)}
.sh figcaption{display:flex;flex-direction:column;font-size:12px;line-height:1.45}
.sh figcaption span{color:var(--muted);overflow-wrap:anywhere}
.shipbox{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:8px}
.upl{cursor:pointer;display:inline-flex;align-items:center}
.ticker{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:42px}
.tklabel{flex:none;background:var(--cap-a);color:#fff;font-weight:700;font-size:12px;letter-spacing:.06em;padding:0 10px;display:flex;align-items:center}
.tkview{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.tktrack{display:inline-flex;align-items:center;white-space:nowrap;animation:tick linear infinite;will-change:transform}
.ticker:hover .tktrack{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding-inline:14px 18px}
.tk .tier{width:20px;height:20px;font-size:10px}
.tk .ago{color:var(--muted);font-size:12px}
.tk.big .pz{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.tktrack{animation:none!important}.tkview{overflow-x:auto}}
.oddsbtn{width:100%;background:var(--surface)}
.dome .cap{animation:bob 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -3px}}
.machine.spin .cap{animation:tumble .42s ease-in-out 3;animation-delay:calc(var(--d,0s) / 6)}
@keyframes tumble{0%,100%{translate:0 0}30%{translate:-7px -16px}65%{translate:6px -7px}}
.pull{transition:transform .12s, box-shadow .12s}
.pull:active{transform:scale(.95)}
.res.big{animation:pop .35s both,glow 1.6s ease-in-out .4s infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--c),0 0 20px 8px color-mix(in srgb,var(--c) 55%,transparent)}}
/* 抽選演出（いつも暗い背景で見せる） */
.fx{position:fixed;inset:0;z-index:70;background:rgba(4,10,22,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;overflow:hidden;opacity:0;transition:opacity .25s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fx.in{opacity:1}.fx.out{opacity:0}
.fx-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.fx-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.fx-rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;translate:-50% -50%;opacity:0;transition:opacity .6s;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--ct) 60%,transparent) 0 7deg,transparent 7deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 42%);mask-image:radial-gradient(circle,#000 0,transparent 42%);animation:spinR 14s linear infinite}
@keyframes spinR{to{rotate:360deg}}
.fx-stage{position:relative;width:150px;height:150px;z-index:2}
.fx-cap{position:absolute;inset:0;translate:0 -70vh}
.fx.in .fx-cap{animation:fxDrop .75s cubic-bezier(.3,1.45,.5,1) forwards,fxShake .5s .95s ease-in-out 2}
.fx.t2.in .fx-cap,.fx.t3.in .fx-cap{animation:fxDrop .75s cubic-bezier(.3,1.45,.5,1) forwards,fxShake .38s .95s ease-in-out 5}
@keyframes fxDrop{from{translate:0 -70vh}to{translate:0 0}}
@keyframes fxShake{0%,100%{rotate:0deg}25%{rotate:-15deg}75%{rotate:15deg}}
.fx-top,.fx-bot{position:absolute;left:0;right:0;height:50%;transition:transform .65s cubic-bezier(.2,.9,.3,1.15),opacity .65s,background-color .15s}
.fx-top{top:0;border-radius:75px 75px 0 0;background-color:var(--cc);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.fx-bot{bottom:0;border-radius:0 0 75px 75px;background:#F4F6F9;box-shadow:inset 0 5px 0 rgba(0,0,0,.08)}
.fx-shine{position:absolute;left:20%;top:12%;width:30%;height:18%;border-radius:50%;background:rgba(255,255,255,.55);rotate:-30deg;transition:opacity .3s}
.fx.promo .fx-top{background-color:var(--cf)}
.fx.promo .fx-flash{animation:flash .55s}
.fx.promo .fx-rays{opacity:.35}
.fx.t3.promo .fx-stage{animation:throb .5s ease-in-out infinite}
@keyframes throb{50%{scale:1.08}}
@keyframes flash{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
.fx.open .fx-top{transform:translateY(-130px) rotate(-28deg);opacity:0}
.fx.open .fx-bot{transform:translateY(130px) rotate(18deg);opacity:0}
.fx.open .fx-shine{opacity:0}
.fx.open .fx-flash{animation:flash .7s}
.fx.open.t1 .fx-rays{opacity:.45}
.fx.open.t2 .fx-rays,.fx.open.t3 .fx-rays{opacity:1}
.fx-label{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:5;width:min(calc(100vw - 32px),420px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#fff;opacity:0;scale:.5;transition:opacity .35s .15s,scale .55s .15s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.fx.open .fx-label{opacity:1;scale:1}
.fx-head{font-family:var(--display);font-size:clamp(34px,11vw,56px);line-height:1.1;color:var(--ct);text-shadow:0 0 22px color-mix(in srgb,var(--ct) 70%,transparent),0 3px 0 rgba(0,0,0,.45);letter-spacing:.04em}
.fx.t3 .fx-head{animation:pulse .9s ease-in-out infinite}
.fx.t1 .fx-head,.fx.t0 .fx-head{font-size:clamp(20px,6vw,26px)}
@keyframes pulse{50%{scale:1.08}}
.fx-prize{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:12px 18px 12px 12px;text-align:left;max-width:100%}
.fx-prize img{width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none;background:#fff}
.fx-dot{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:#fff;background:var(--cf);box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.fx-rank{font-family:var(--display);font-size:22px;color:var(--ct)}
.fx-name{font-weight:700;font-size:17px;line-height:1.4;overflow-wrap:anywhere}
.fx-more{font-size:13px;color:rgba(255,255,255,.7)}
.fx-hint{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:rgba(255,255,255,.55);font-size:12px;z-index:5}
.costline{margin-top:10px;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.55}
.costline.ok{background:var(--green-soft);color:var(--green)}
.costline.ng{background:color-mix(in srgb,var(--danger) 13%,var(--surface));color:var(--danger)}
.consent{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.consent .check{align-items:flex-start}.consent .check input{margin-top:2px;flex:none}
.foot{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;padding-block:20px 8px;font-size:12px;color:var(--muted)}
.foot a,.consent a,.shipbox a{color:var(--blue)}
.policy{display:flex;flex-direction:column;gap:8px;font-size:14px}.policy h4{margin:8px 0 0;font-size:15px}.policy ul,.policy ol{margin:0;padding-left:1.4em}.policy p{margin:0}
dl.share{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:8px 0;font-size:13px}dl.share dt{color:var(--muted);font-weight:700}dl.share dd{margin:0;min-width:0;overflow-wrap:anywhere}
.lastone.kiri{border-color:var(--cap-k)}.lastone.kiri .cnt{color:var(--cap-k)}
.kiribanner{border-radius:14px;padding:14px;background:color-mix(in srgb,var(--cap-k) 16%,var(--surface));border:1.5px solid var(--cap-k);display:flex;gap:12px;align-items:center}
.kiribanner .display{font-size:18px;color:var(--cap-k)}
.promo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:linear-gradient(90deg,var(--green-soft),var(--blue-soft));border-radius:14px;padding:10px 12px}
.promo .prtag{flex:none;font-size:10px;font-weight:700;letter-spacing:.08em;border:1px solid var(--muted);color:var(--muted);border-radius:4px;padding:1px 5px}
.promo .pt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}.promo .pt .small{color:var(--muted)}
.promo .pv{flex:none;display:flex;flex-direction:column;align-items:flex-end;color:var(--green);line-height:1.3}.promo .pv .small{color:var(--muted)}
.item.reco{padding:8px 0}.nextreco{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.install{background:var(--blue-soft);border:1.5px solid var(--blue);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.install ol{margin:4px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:2px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.55}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.tag{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
label.f input,label.f select,label.f textarea{font-weight:400;font-size:16px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.form{display:flex;flex-direction:column;gap:12px}
.err{color:var(--danger);font-size:13px;min-height:1em}
.check{display:flex;align-items:center;gap:10px}
.check input{width:20px;height:20px;accent-color:var(--blue)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;gap:6px;align-items:center;font-size:14px}
.opts input{accent-color:var(--blue)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--blue)}
nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,14,26,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-size:18px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.results.many{grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px}
.res{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--display);color:#fff;background:var(--c);animation:pop .35s both;max-width:100%}
.results.many .res{font-size:11px}
.res.big{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--c)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.summary span{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 4px;font-size:14px;font-weight:700}
.l1banner{border-radius:14px;padding:14px;background:var(--cap-l);color:var(--bg);display:flex;gap:12px;align-items:center}
.l1banner .display{font-size:18px;color:var(--cap-a)}
.ad{border-radius:14px;padding:20px;background:linear-gradient(135deg,var(--green),var(--blue));color:#fff;display:flex;flex-direction:column;gap:6px;min-height:160px;justify-content:flex-end}
.ad .display{font-size:22px}
.count{font-family:var(--display);font-size:40px;text-align:center;color:var(--blue)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* login */
.hero{display:flex;flex-direction:column;gap:10px;padding-block:28px 8px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.2}
.hero h1 em{font-style:normal;color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:22px}
.tablewrap{overflow-x:auto}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px;line-height:1.6}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== 見た目の仕上げ（暗い背景のゲームセンター風） ===== */
html,body{background:var(--bg)}
body{background:radial-gradient(1100px 520px at 50% -8%,rgba(61,139,255,.30),transparent 62%),radial-gradient(700px 480px at 115% 35%,rgba(43,212,138,.13),transparent 62%),radial-gradient(700px 520px at -25% 85%,rgba(139,108,255,.16),transparent 62%),var(--bg);background-attachment:fixed;min-height:100%}
header.top{background:rgba(7,15,34,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{color:#fff;text-shadow:0 0 18px rgba(61,139,255,.7)}
.logo i{background:linear-gradient(180deg,var(--green) 0 50%,#fff 50%);box-shadow:0 0 10px var(--green)}
.bal{background:rgba(255,255,255,.06);border:1px solid rgba(255,210,90,.35)}
.bal b{color:var(--gold);text-shadow:0 0 10px rgba(255,210,90,.4)}
.ticket-ico{background:var(--gold)}.ticket-ico::before,.ticket-ico::after{background:#0B1530}
.bal button{background:linear-gradient(135deg,var(--green),var(--blue));color:#fff}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.28)}
.card h2{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.03em}
.btn{background:linear-gradient(135deg,#4C9BFF,#2563EB);color:#fff;box-shadow:0 6px 18px rgba(61,139,255,.32)}
.btn.green{background:linear-gradient(135deg,#34E39A,#12A86A);box-shadow:0 6px 18px rgba(43,212,138,.28)}
.btn.ghost{background:rgba(255,255,255,.04);box-shadow:none;border:1px solid rgba(255,255,255,.16);color:var(--ink)}
.btn[disabled]{box-shadow:none}
/* ガチャ台 */
.stage{position:relative;background:radial-gradient(120% 65% at 50% 30%,color-mix(in srgb,var(--machine) 40%,transparent),transparent 72%),linear-gradient(180deg,#0F1D40,#091330);border:1px solid color-mix(in srgb,var(--machine) 50%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 22px 50px rgba(0,0,0,.5),0 0 60px color-mix(in srgb,var(--machine) 22%,transparent)}
.stage::before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg at 50% 34%,rgba(255,255,255,.04) 0 7deg,transparent 7deg 17deg);animation:spinR 80s linear infinite;pointer-events:none}
.stage>*{position:relative;z-index:1}
.dome{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6) 0 9%,transparent 10%),radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--machine) 35%,transparent),transparent 70%),rgba(255,255,255,.07);box-shadow:0 0 34px color-mix(in srgb,var(--machine) 55%,transparent),inset 0 -24px 40px rgba(0,0,0,.35)}
.body{background:linear-gradient(180deg,var(--machine),var(--machine-2));box-shadow:inset 0 -8px 0 rgba(0,0,0,.25),0 16px 26px rgba(0,0,0,.45)}
.machine::after{content:"";position:absolute;left:8%;right:8%;bottom:-16px;height:18px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--machine) 60%,transparent),transparent)}
.lastone{background:rgba(255,210,90,.07);border:1px solid rgba(255,210,90,.45)}
.lastone .cnt{color:var(--gold);text-shadow:0 0 14px rgba(255,210,90,.55)}
.lastone.kiri{background:rgba(255,159,28,.07);border-color:rgba(255,159,28,.5)}
.bar{background:rgba(255,255,255,.09)}
.bar i{box-shadow:0 0 12px color-mix(in srgb,var(--green) 70%,transparent)}
.pull{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.2);color:#fff}
.pull small{color:var(--muted)}
.pull.hot{background:linear-gradient(135deg,#FFE07A,#FF9F1C);border:0;color:#2A1600;box-shadow:0 8px 24px rgba(255,170,40,.45);animation:hotPulse 2.4s ease-in-out infinite}
.pull.hot small{color:#5A3600;opacity:1}
@keyframes hotPulse{50%{box-shadow:0 8px 32px rgba(255,170,40,.8)}}
.gcard{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1)}
.gcard[aria-selected="true"]{background:color-mix(in srgb,var(--machine) 20%,transparent);border-color:var(--machine);box-shadow:0 0 20px color-mix(in srgb,var(--machine) 45%,transparent)}
.gdot{box-shadow:0 0 8px var(--machine)}
.gbar{background:rgba(255,255,255,.1)}
/* 速報・PR */
.ticker{background:rgba(255,255,255,.04);border-color:rgba(255,210,90,.25)}
.tklabel{background:linear-gradient(135deg,#FFE07A,#FF9F1C);color:#2A1600}
.tk.big .pz{color:var(--gold)}
.promo{background:linear-gradient(90deg,rgba(43,212,138,.16),rgba(61,139,255,.18));border-color:rgba(255,255,255,.14);color:var(--ink)}
.promo .pv{color:var(--green)}
/* ログイン画面のヒーロー */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:30px 20px 24px;margin-top:6px;background:radial-gradient(90% 80% at 85% 10%,rgba(43,212,138,.35),transparent 60%),radial-gradient(90% 90% at 10% 100%,rgba(139,108,255,.35),transparent 60%),linear-gradient(160deg,#1A3D8F,#0B1A45);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.hero::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 70% 30%,rgba(255,255,255,.05) 0 6deg,transparent 6deg 16deg);animation:spinR 90s linear infinite}
.hero::after{content:"";position:absolute;right:-26px;bottom:-34px;width:92px;height:128px;border-radius:999px;transform:rotate(28deg);background:linear-gradient(180deg,#FFD25A 0 52%,rgba(255,255,255,.92) 52%);box-shadow:0 14px 30px rgba(0,0,0,.4),inset 10px 10px 0 rgba(255,255,255,.25);opacity:.95}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(26px,7vw,36px);text-wrap:nowrap;white-space:nowrap}
.hero p{max-width:30em;padding-right:40px}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero h1{color:#fff}
.hero h1 em{color:var(--gold);text-shadow:0 0 22px rgba(255,210,90,.55)}
.hero .muted{color:rgba(238,243,252,.82)}
/* そのほか */
nav.tabs{background:rgba(7,15,34,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.tabs button[aria-current="page"]{color:#fff}
nav.tabs button[aria-current="page"] svg{color:var(--blue);filter:drop-shadow(0 0 6px var(--blue))}
.scrim{background:rgba(2,6,16,.72)}
.sheet{background:linear-gradient(180deg,#132551,#0B1736);border:1px solid var(--line)}
label.f input,label.f select,label.f textarea{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
.note,.shipbox,.consent,.nextreco{background:rgba(255,255,255,.05)}
.stat{background:rgba(255,255,255,.05)}
.seg{background:rgba(255,255,255,.04);border-color:var(--line)}
.seg button[aria-selected="true"]{background:var(--blue);color:#fff;box-shadow:none}
.chip{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.14)}
.chip[aria-pressed="true"]{background:var(--blue-soft);color:#fff;border-color:var(--blue)}
.pack{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.14)}
.pack .display{color:var(--gold)}
.sh img{box-shadow:0 10px 24px rgba(0,0,0,.45)}
.reward{color:var(--green);text-shadow:0 0 10px rgba(43,212,138,.35)}
.toast{background:#F4F7FD;color:#0A1428;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.install{background:var(--blue-soft)}
.foot a,.consent a,.shipbox a{color:#7FB2FF}

/* ===== 華やかさ ===== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spinAng{to{--ang:360deg}}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.75;animation:twinkle 5s ease-in-out infinite alternate;
  background-image:radial-gradient(1.6px 1.6px at 12% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 78% 12%,#FFE7A3,transparent),radial-gradient(1.4px 1.4px at 42% 34%,#fff,transparent),radial-gradient(1px 1px at 88% 46%,#BFD6FF,transparent),radial-gradient(1.6px 1.6px at 22% 62%,#FFE7A3,transparent),radial-gradient(1.2px 1.2px at 64% 72%,#fff,transparent),radial-gradient(1px 1px at 8% 88%,#BFD6FF,transparent),radial-gradient(1.4px 1.4px at 52% 92%,#fff,transparent),radial-gradient(1px 1px at 94% 82%,#FFE7A3,transparent),radial-gradient(1.2px 1.2px at 33% 8%,#BFD6FF,transparent)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;animation:twinkle 7s ease-in-out infinite alternate-reverse;
  background-image:radial-gradient(1.2px 1.2px at 30% 24%,#fff,transparent),radial-gradient(1.6px 1.6px at 70% 30%,#FFE7A3,transparent),radial-gradient(1px 1px at 58% 52%,#fff,transparent),radial-gradient(1.4px 1.4px at 14% 44%,#BFD6FF,transparent),radial-gradient(1.2px 1.2px at 84% 66%,#fff,transparent),radial-gradient(1.6px 1.6px at 40% 80%,#FFE7A3,transparent)}
@keyframes twinkle{from{opacity:.25}to{opacity:.85}}
main,#hdr,nav.tabs{position:relative;z-index:1}
header.top{z-index:20}nav.tabs{position:fixed;z-index:30}
/* ガチャごとのバナー */
.ghero{position:relative;overflow:hidden;border-radius:22px;padding:18px 14px 18px 18px;min-height:176px;display:flex;align-items:center;gap:6px;
  background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--machine) 75%,transparent),transparent 62%),radial-gradient(90% 90% at 0% 100%,rgba(255,210,90,.18),transparent 60%),linear-gradient(135deg,color-mix(in srgb,var(--machine) 50%,#0B1530),#0B1530 80%);
  border:1px solid color-mix(in srgb,var(--machine) 65%,transparent);box-shadow:0 0 44px color-mix(in srgb,var(--machine) 32%,transparent),0 18px 40px rgba(0,0,0,.45)}
.ghero::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 75% 45%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 15deg);animation:spinR 50s linear infinite}
.gh-text{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.gh-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.75)}
.gh-title{font-family:var(--display);font-weight:400;font-size:clamp(21px,6vw,28px);line-height:1.15;background:linear-gradient(180deg,#FFFFFF 30%,#FFE08A);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}
.gh-sub{margin:0;font-size:12px;color:rgba(238,243,252,.85)}
.gh-top{margin-top:6px;align-self:flex-start;display:inline-flex;gap:6px;align-items:center;max-width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(255,210,90,.55);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;font-weight:700}
.gh-top span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gh-badge{flex:none;background:linear-gradient(135deg,#FFE07A,#FF9F1C);color:#2A1600;border-radius:999px;padding:1px 8px;font-family:var(--display);font-size:11px}
.gh-fan{position:relative;z-index:1;width:128px;height:132px;flex:none}
.gh-fan>*{position:absolute;width:74px;height:74px;border-radius:14px;object-fit:cover;border:2px solid rgba(255,255,255,.3);box-shadow:0 10px 24px rgba(0,0,0,.55)}
.gh-fan .f0{left:0;top:40px;rotate:-14deg}
.gh-fan .f1{right:0;top:40px;rotate:14deg}
.gh-fan .f2{left:22px;top:8px;width:86px;height:86px;z-index:2;border-color:rgba(255,210,90,.85);box-shadow:0 0 26px rgba(255,210,90,.55),0 12px 26px rgba(0,0,0,.55);animation:floaty 3.2s ease-in-out infinite}
.gh-fan .ph{display:grid;place-items:center;font-family:var(--display);font-size:28px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#000))}
@keyframes floaty{50%{translate:0 -7px}}
.spk{position:absolute;z-index:1;width:14px;height:14px;background:#FFE08A;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:spark 2.6s ease-in-out infinite;pointer-events:none}
@keyframes spark{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
/* 切り替えカード */
.gcard{flex-basis:min(44%,176px)}
.gimg{display:block;width:100%;height:66px;object-fit:cover;border-radius:10px;margin-bottom:4px}
.gimg.ph{display:grid;place-items:center;font-family:var(--display);font-size:24px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#000))}
.gcard[aria-selected="true"]{border:2px solid transparent;background:linear-gradient(color-mix(in srgb,var(--machine) 22%,#0D1A38),color-mix(in srgb,var(--machine) 22%,#0D1A38)) padding-box,conic-gradient(from var(--ang),var(--machine),#FFD25A,#FF4F8B,var(--machine)) border-box;animation:spinAng 4s linear infinite}
/* 10回ボタンに光を走らせる */
.pull.hot,.tklabel{position:relative;overflow:hidden}
.pull.hot::after,.tklabel::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3s ease-in-out infinite;pointer-events:none}
@keyframes shine{55%,100%{transform:translateX(120%)}}
.pull .display{font-size:24px}
/* 見出しに星 */
.card h2::before{content:"✦";color:var(--gold);margin-right:6px;font-size:.85em;text-shadow:0 0 8px rgba(255,210,90,.6)}
/* 下のメニュー */
nav.tabs button{isolation:isolate}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;z-index:-1;top:5px;left:50%;translate:-50% 0;width:52px;height:30px;border-radius:12px;background:linear-gradient(135deg,rgba(61,139,255,.45),rgba(43,212,138,.4));box-shadow:0 0 16px rgba(61,139,255,.45)}
nav.tabs button[aria-current="page"] svg{color:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}

.gh-title{font-size:clamp(17px,5vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:nowrap}
.stage>.boxline,.stage>p.small{display:none}

/* ===== 遊びの仕掛け ===== */
.snd{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin-left:auto;flex:none}
.snd[aria-pressed="false"]{color:var(--muted)}
.snd+.bal{margin-left:0}
.rankchip{font-size:10px;font-weight:700;letter-spacing:.04em;color:#0B1530;background:var(--rc,#D9965A);border-radius:999px;padding:1px 8px;box-shadow:0 0 10px color-mix(in srgb,var(--rc,#D9965A) 60%,transparent)}
.rankchip:empty{display:none}
.ru-badge{flex:none;display:grid;place-items:center;min-width:64px;height:64px;padding:0 8px;border-radius:50%;font-family:var(--display);font-size:14px;color:#0B1530;background:radial-gradient(circle at 35% 30%,#fff,var(--rc) 60%);box-shadow:0 0 22px color-mix(in srgb,var(--rc) 70%,transparent)}
.rankcard{background:radial-gradient(80% 120% at 0% 0%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.ranks{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.ranks span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;line-height:1.3}
.ranks span.on{color:var(--rc);text-shadow:0 0 8px color-mix(in srgb,var(--rc) 60%,transparent)}
.ranks small{font-size:10px;font-weight:400;color:var(--muted)}
.rankup{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px;border:1.5px solid var(--rc);background:color-mix(in srgb,var(--rc) 14%,transparent);animation:pop .5s both}
.rankup .display{color:var(--rc);font-size:18px}
.rankup .ru-badge{min-width:52px;height:52px;font-size:12px}
/* スクラッチ */
.scratch{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:15/8;max-width:100%;background:radial-gradient(circle at 50% 40%,#2A3F7A,#0E1A3A);border:2px solid rgba(255,210,90,.5)}
.scr-prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff}
.scr-prize b{font-size:44px;color:var(--gold);text-shadow:0 0 18px rgba(255,210,90,.6)}
.scr-prize.big b{font-size:56px;animation:pulse .9s ease-in-out infinite}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;transition:opacity .5s}
.scratch canvas.gone{opacity:0;pointer-events:none}
/* 図鑑 */
.zukan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.zk{margin:0;position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.zk img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;filter:grayscale(1) brightness(.35);border:1px solid rgba(255,255,255,.1)}
.zk.got img{filter:none;border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent)}
.zk-rk{position:absolute;left:4px;top:4px;min-width:20px;height:20px;border-radius:10px;background:var(--c);color:#fff;font:400 11px/20px var(--display);text-align:center;padding:0 4px}
.zk-n{position:absolute;right:4px;top:4px;font-size:11px;font-weight:700;background:rgba(0,0,0,.6);border-radius:8px;padding:0 6px}
.zk-q{position:absolute;left:0;right:0;top:0;aspect-ratio:1;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:rgba(255,255,255,.35)}
.zk figcaption{font-size:10px;line-height:1.3;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.zk.got figcaption{color:var(--ink)}
@media (max-width:360px){.zukan{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* タップで開ける */
.fx-skip{position:absolute;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.fx.dropped .fx-cap{translate:0 0;animation:none}
.fx.wait .fx-cap{animation:wobble 1s ease-in-out infinite}
.fx.dropped .fx-cap.hit{animation:hit .28s ease-out}
@keyframes wobble{0%,100%{rotate:-5deg}50%{rotate:5deg}}
@keyframes hit{0%{scale:1}35%{scale:1.16;rotate:-12deg}70%{rotate:9deg}100%{scale:1;rotate:0deg}}
.fx-crack{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fx-crack path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:0;filter:drop-shadow(0 0 6px var(--ct));transition:opacity .15s}
.fx[data-taps="1"] .c1,.fx[data-taps="2"] .c1,.fx[data-taps="3"] .c1,.fx[data-taps="2"] .c2,.fx[data-taps="3"] .c2{opacity:1}
.fx.open .fx-crack{opacity:0}
.fx[data-taps="1"] .fx-stage{filter:drop-shadow(0 0 18px var(--ct))}
.fx[data-taps="2"] .fx-stage{filter:drop-shadow(0 0 36px var(--ct))}
.fx-tap{position:absolute;z-index:5;left:0;right:0;top:calc(50% + 100px);display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;opacity:0;transition:opacity .25s;pointer-events:none}
.fx-tap b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;text-shadow:0 0 16px var(--ct);animation:pulse 1s ease-in-out infinite}
.fx-tap span{font-size:13px;color:rgba(255,255,255,.75)}.fx-tap em{font-style:normal;font-weight:700;color:var(--gold);font-size:16px}
.fx.wait .fx-tap{opacity:1}
.fx .fx-hint{opacity:0;transition:opacity .3s}.fx.open .fx-hint{opacity:1}

.fx-stage{position:absolute!important;left:0;right:0;top:0;bottom:0;margin:auto}
header.top .wrap{gap:8px}
.logo,.rankchip,.bal,.bal button{white-space:nowrap;flex-shrink:0}
@media (max-width:440px){.logo{font-size:17px}.rankchip{font-size:11px;padding:3px 7px}header.top .wrap{gap:6px}}

.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2,rgba(255,255,255,.06))}
.seg button{flex:1;border:0;border-radius:9px;padding:9px;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--blue,#3D8BFF);color:#fff}
.linkbtn{background:none;border:0;color:var(--blue,#3D8BFF);text-decoration:underline;cursor:pointer;padding:4px 0;align-self:flex-start;font:inherit}
.card.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 16px}
.ldspin{display:inline-block;width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold,#FFD25A);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#machine.wait{opacity:.85}

.lockb{display:inline-block;align-self:flex-start;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;color:#111;background:var(--rc);margin:2px 0}
.locked{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:14px;border-radius:14px;border:1.5px dashed var(--rc);background:color-mix(in srgb,var(--rc) 12%,transparent)}
.locked b{color:var(--rc)}
.perks{margin-top:10px}.perks summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.perk{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}.perk b{color:var(--rc);min-width:4.5em}.perk.me{background:color-mix(in srgb,var(--rc) 10%,transparent);border-radius:8px;padding:6px 8px}

.hitsleft{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hl{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:700}
.hl b{font-size:20px;color:var(--gold)}.hl small{color:var(--muted)}.hl.out{opacity:.45}.hl.out b{color:inherit}
.aleft{color:var(--gold)}
.hist summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;list-style:none}.hist summary::-webkit-details-marker{display:none}
.hrow{display:block;line-height:2}.hrow .tier{vertical-align:middle;margin-right:6px}
.evbar{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,#FF5FA2,#FFD25A,#3D8BFF);color:#111;font-size:13px;box-shadow:0 6px 24px rgba(255,95,162,.35)}
.evbar b{font-size:14px}
.invite .refcode{font-family:var(--display);font-size:22px;letter-spacing:.08em;color:var(--gold)}
.fx.god .fx-rays{background:conic-gradient(from 0deg,#ff5f6d,#ffc371,#fff36b,#7cf29a,#5fd3ff,#a78bfa,#ff5fa2,#ff5f6d)!important;opacity:.55;animation:spin 2.2s linear infinite}
.fx-god{position:absolute;left:50%;top:14%;translate:-50% 0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;animation:godpop 2.2s ease-out forwards}
.fx-god b{font-family:var(--display);font-size:48px;line-height:1;background:linear-gradient(90deg,#ff5f6d,#ffc371,#fff36b,#7cf29a,#5fd3ff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,255,255,.6))}
.fx-god span{font-weight:800;color:#fff;text-shadow:0 0 10px #ff5fa2}
@keyframes godpop{0%{opacity:0;scale:.4}12%{opacity:1;scale:1.25}25%{scale:1}80%{opacity:1}100%{opacity:0;scale:1.05}}

.prefgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:2px 8px}
.areas{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.areas summary{cursor:pointer}

.sharebtn{width:100%;margin:6px 0 2px;background:linear-gradient(90deg,#FF5FA2,#FFD25A);color:#111;font-weight:800}

/* ガチャ機：投入口・レバーのつまみ・受け皿 */
.body .slot{position:absolute;left:50%;top:14px;translate:-50% 0;width:34px;height:12px;border-radius:6px;background:rgba(0,0,0,.45);box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.18)}
.body .slot i{position:absolute;inset:3px 5px;border-radius:3px;background:#000}
.body .slot.gulp{animation:gulp .28s ease-out}
.machine.insert .slot{box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 0 0 3px #FFD25A,0 0 18px #FFD25A}
@keyframes gulp{0%{scale:1}40%{scale:1.35 1.6}100%{scale:1}}
.tkfly{position:fixed;z-index:80;width:44px;height:28px;border-radius:6px;pointer-events:none;
  background:radial-gradient(circle at 0 50%,transparent 6px,#FFD25A 6.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 6px,#FFB020 6.5px) right/51% 100% no-repeat;
  box-shadow:0 4px 14px rgba(255,190,40,.6);filter:drop-shadow(0 0 6px rgba(255,220,120,.8))}
.tkfly::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;border-left:2px dashed rgba(120,70,0,.5)}
.handle{transition:none}
.handle .knob{position:absolute;left:50%;top:-9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--machine-2);box-shadow:0 2px 4px rgba(0,0,0,.35)}
.machine.crank .handle{animation:crank 1s cubic-bezier(.3,.1,.3,1)}
.machine.crank .dome{animation:shake .25s ease-in-out 4}
.machine.crank .dome .cap{animation:tumble .32s ease-in-out 3;animation-delay:calc(var(--d,0s) / 8)}
@keyframes crank{0%{transform:rotate(0)}18%{transform:rotate(100deg)}26%{transform:rotate(88deg)}46%{transform:rotate(200deg)}54%{transform:rotate(188deg)}74%{transform:rotate(300deg)}82%{transform:rotate(290deg)}100%{transform:rotate(360deg)}}
.outlet{overflow:visible}
.outlet .flap{position:absolute;left:4px;right:4px;top:4px;height:16px;border-radius:6px 6px 2px 2px;background:rgba(255,255,255,.18);transform-origin:50% 0;z-index:2}
.machine.dropping .flap{animation:flap .5s .2s ease-out}
@keyframes flap{0%{transform:rotateX(0)}30%{transform:rotateX(-75deg)}100%{transform:rotateX(0)}}
.body .tray{position:absolute;right:12px;bottom:6px;width:60px;height:14px;border-radius:0 0 12px 12px;background:rgba(0,0,0,.35);box-shadow:inset 0 3px 4px rgba(0,0,0,.5)}
.outlet .drop{z-index:3}
.machine.dropping .drop{animation:capdrop .95s cubic-bezier(.3,.1,.4,1) forwards}
@keyframes capdrop{0%{opacity:0;transform:translateY(-28px) scale(.6) rotate(0)}
  30%{opacity:1;transform:translateY(34px) scale(1) rotate(80deg)}
  44%{transform:translateY(18px) rotate(140deg)}54%{transform:translateY(34px) rotate(180deg)}
  62%{transform:translateY(28px) rotate(200deg)}70%{transform:translateY(34px) rotate(215deg)}
  100%{opacity:1;transform:translateY(34px) translateX(-6px) rotate(250deg)}}
.machine.dropping .drop{box-shadow:0 0 0 0 var(--c)}
.machine.popout .drop{animation:capdrop .01s forwards,popout .26s ease-in forwards}
@keyframes popout{to{transform:translateY(20px) scale(2.4);opacity:0;filter:brightness(1.8)}}
body.drawing .pull,body.drawing .gcard{pointer-events:none}
body.drawing .pulls{opacity:.6}

/* ステップアップ予告 */
.stepfx{position:fixed;inset:0;z-index:75;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--sc,#fff) 22%,transparent),rgba(3,8,20,.88) 62%);opacity:0;transition:opacity .18s;cursor:pointer;overflow:hidden}
.stepfx.on{opacity:1}
.stepfx.hot{animation:quake .32s ease-in-out 2}
.st-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 16px}
.st-lab{font-family:var(--display);font-size:22px;letter-spacing:.3em;color:var(--sc);opacity:.85}
.st-txt{font-family:var(--display);font-size:clamp(40px,12vw,68px);line-height:1.05;color:var(--sc);text-shadow:0 0 22px var(--sc),0 5px 0 rgba(0,0,0,.45)}
.st-txt.pop{animation:stpop .42s cubic-bezier(.2,1.6,.4,1)}
.stepfx.rainbow .st-txt,.stepfx.rainbow .st-lab{background:linear-gradient(90deg,#ff5f6d,#ffc371,#fff36b,#7cf29a,#5fd3ff,#a78bfa,#ff5fa2);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,255,255,.7))}
.stepfx.rainbow{background:conic-gradient(from 0deg at 50% 45%,rgba(255,95,109,.35),rgba(255,195,113,.35),rgba(255,243,107,.35),rgba(124,242,154,.35),rgba(95,211,255,.35),rgba(167,139,250,.35),rgba(255,95,162,.35),rgba(255,95,109,.35)),rgba(3,8,20,.85)}
.st-dots{display:flex;gap:10px}.st-dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.15);transition:background .2s,box-shadow .2s}
.st-dots i.on{background:var(--sc);box-shadow:0 0 12px var(--sc)}
.st-ring{position:absolute;left:50%;top:45%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid var(--sc);opacity:0}
.st-ring.go{animation:ring .6s ease-out}
@keyframes stpop{0%{transform:scale(2.4);opacity:0;filter:blur(6px)}60%{transform:scale(.92);opacity:1;filter:none}100%{transform:scale(1)}}
@keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(7);opacity:0}}
@keyframes quake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,3px)}}
/* カットイン */
.fx-cut{position:absolute;left:-15%;right:-15%;top:22%;height:110px;z-index:6;display:grid;place-items:center;pointer-events:none;transform:skewY(-9deg);
  background:linear-gradient(90deg,transparent,var(--cutc) 14%,var(--cutc) 86%,transparent);box-shadow:0 0 40px var(--cutc);animation:cutin 1.25s cubic-bezier(.2,.9,.3,1) forwards}
.fx-cut b{font-family:var(--display);font-size:clamp(44px,13vw,72px);color:#fff;letter-spacing:.06em;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 18px rgba(255,255,255,.6);transform:skewY(9deg)}
.fx-cut.hot{--cutc:#E8213A}.fx-cut.hot b{color:#FFE36B}
.fx-cut.chance{--cutc:#2F7BFF}
@keyframes cutin{0%{translate:-115% 0}16%{translate:0 0}80%{translate:0 0;opacity:1}100%{translate:115% 0;opacity:.6}}
.fx.quake .fx-stage{animation:quake .3s ease-in-out 3}
/* 色が上がる瞬間 */
.fx.climb .fx-flash{animation:flash .45s}
.fx.climb .fx-cap{animation:climbpop .35s ease-out}
@keyframes climbpop{0%{scale:1}40%{scale:1.18}100%{scale:1}}
.fx.tease .fx-rays{opacity:.3}
.fx.t3.tease .fx-stage,.fx.t2.tease .fx-stage{animation:throb .5s ease-in-out infinite}
.stepfx.rainbow .st-txt{font-size:clamp(34px,10.5vw,60px);white-space:nowrap}

/* マスコット */
.mascot{--kc:#FF6B8A;--kc2:#FFB4C2;position:fixed;left:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:95;width:110px;pointer-events:none;transform:translateY(160%) rotate(-8deg);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.mascot.on{transform:translateY(0) rotate(0)}
.mascot .m-pup{transform-origin:50% 100%;animation:puppet 1.6s ease-in-out infinite}
.mascot.m-talk .m-pup{animation:puppetTalk .28s ease-in-out infinite}
.mascot .k-mouth{transform-origin:70px 100px;transition:transform .12s}
.mascot.m-talk .k-mouth{animation:mouth .22s ease-in-out infinite}
.mascot.m-wow .k-mouth{transform:scale(1.15,1.9)}.mascot.m-wow .k-pups{transform:translateY(-3px)}
.mascot .k-lid,.mascot .k-star{opacity:0;transition:opacity .2s}
.mascot.m-sad .k-lid{opacity:1}.mascot.m-sad .k-mouth{transform:scale(.7,.5)}
.mascot.m-joy .k-star{opacity:1}.mascot.m-joy .k-pups{opacity:0}
.mascot.m-joy .k-armL{animation:waveL .35s ease-in-out infinite}.mascot.m-joy .k-armR{animation:waveR .35s ease-in-out infinite}
.mascot .k-arm{transform-box:fill-box}
.m-bub{position:absolute;left:84px;bottom:92px;min-width:120px;max-width:min(62vw,240px);padding:9px 13px;border-radius:16px 16px 16px 4px;background:#fff;color:#1A1A1A;font-weight:800;font-size:14px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:normal}
.m-bub:empty{display:none}.m-bub.pop{animation:bubpop .3s cubic-bezier(.3,1.7,.5,1)}
@keyframes puppet{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
@keyframes puppetTalk{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-6px)}}
@keyframes mouth{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,1.9)}}
@keyframes waveL{0%,100%{transform:rotate(0)}50%{transform:rotate(-25deg)}}@keyframes waveR{0%,100%{transform:rotate(0)}50%{transform:rotate(25deg)}}
@keyframes bubpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
/* フリーズ */
.freeze{position:fixed;inset:0;z-index:96;background:#000;display:grid;place-items:center;cursor:default}
.fz-dots{color:rgba(255,255,255,.25);font-size:28px;letter-spacing:.4em;animation:fzblink 1s steps(2) infinite}
.fz-txt{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0}
.fz-txt b{font-family:var(--display);font-size:clamp(48px,15vw,90px);background:linear-gradient(90deg,#ff5f6d,#ffc371,#fff36b,#7cf29a,#5fd3ff,#a78bfa,#ff5fa2);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,255,255,.8))}
.fz-txt span{color:#fff;font-weight:800;letter-spacing:.2em}
.freeze.boom{animation:fzflash .6s ease-out}.freeze.boom .fz-dots{display:none}.freeze.boom .fz-txt{opacity:1;animation:stpop .5s cubic-bezier(.2,1.6,.4,1)}
.freeze.out{opacity:0;transition:opacity .25s}
@keyframes fzblink{50%{opacity:.2}}@keyframes fzflash{0%{background:#fff}100%{background:#000}}
/* 金色のガチャ機 */
.machine.golden{--machine:#FFC83D;--machine-2:#B8860B;filter:drop-shadow(0 0 22px rgba(255,210,90,.9))}
.machine.golden .dome{border-color:#FFD25A;box-shadow:0 0 40px rgba(255,210,90,.9),inset 0 -24px 40px rgba(0,0,0,.35)}
.machine.golden .body::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:250% 100%;animation:shine 1s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
/* 逆転 */
.fx-fake,.fx-rev{position:absolute;z-index:7;display:none;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.fx-fake{top:60%}.fx-fake b{font-size:22px;color:rgba(255,255,255,.7)}
.fx.fakeopen .fx-fake{display:flex;animation:bubpop .3s}
.fx.fakeopen .fx-top{transform:translateY(-130px) rotate(-28deg);opacity:0}.fx.fakeopen .fx-bot{transform:translateY(130px) rotate(18deg);opacity:0}
.fx.fakeopen .fx-tap,.fx.fakeopen .fx-label{display:none}
.fx.reverse{animation:quake .3s ease-in-out 4}
.fx.reverse .fx-rev{display:flex;inset:0;justify-content:center;background:radial-gradient(circle,rgba(255,40,60,.45),rgba(0,0,0,.6))}
.fx-rev b{font-family:var(--display);font-size:clamp(40px,12vw,70px);color:#FFE36B;text-shadow:0 0 20px #FF2A48,0 5px 0 #000;transform:rotate(-8deg);animation:stpop .45s cubic-bezier(.2,1.6,.4,1)}
.fx.reverse .fx-flash{animation:flash .5s}
/* ラストワン */
.fx-fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.fx.lastone .fx-rays{background:repeating-conic-gradient(from 0deg,rgba(255,236,150,.32) 0 8deg,transparent 8deg 22deg)!important;animation:spin 6s linear infinite;opacity:1}
.fx.lastone.open .fx-head{font-size:clamp(34px,10vw,52px)}
.lastcount{display:flex;align-items:baseline;gap:10px;justify-content:center;padding:8px 14px;border-radius:14px;background:linear-gradient(90deg,#FF2A48,#FF9F1C);color:#fff;box-shadow:0 0 24px rgba(255,60,80,.6);animation:pulse 1s ease-in-out infinite}
.lastcount b{font-family:var(--display);font-size:20px;letter-spacing:.15em}.lastcount .num{font-family:var(--display);font-size:34px;line-height:1}.lastcount small{font-weight:700}
.lastb{--rc:#FF5A5A;color:#fff!important;animation:pulse 1s ease-in-out infinite}
/* 10連を1個ずつ */
.mopen{position:fixed;inset:0;z-index:72;background:rgba(4,10,22,.94);display:flex;flex-direction:column;justify-content:center;gap:22px;padding:20px 16px;animation:bubpop .25s}
.mopen.out{opacity:0;transition:opacity .25s}
.mo-head{text-align:center;display:flex;flex-direction:column;gap:4px;color:#fff}.mo-head b{font-size:40px}

.mo-top{top:0;border-radius:999px 999px 0 0;background:var(--c)}.mo-bot{bottom:0;border-radius:0 0 999px 999px;background:#F4F6F9}

.mo-cap.open .mo-top{transform:translateY(-40%) rotate(-25deg);opacity:0}.mo-cap.open .mo-bot{transform:translateY(40%) rotate(15deg);opacity:0}.mo-cap.open b{opacity:1}
.mo-cap.big b{font-size:34px;animation:pulse .8s ease-in-out infinite}

  background:linear-gradient(90deg,#FF2A48,#FF9F1C,#FFD25A);color:#111;box-shadow:0 10px 40px rgba(255,80,60,.6);animation:newsin .5s cubic-bezier(.3,1.5,.5,1)}

/* ---------- みんなで共有（Firebase）。アプリ版だけで使う ---------- */
const SHARED=!!window.EX_SHARED;
const Sync=(()=>{
  const S={state:'boot',email:null,admins:[],isAdmin:false,err:'',mode:'signup',pending:null,adminSeen:false};
  const base={},ver={},inflight={},held={},ordOf={},got=new Set();
  let unsubs=[],scopeUnsubs=[],renderT=null,renderWait=null;
  // 項目の並び順に左右されない比較（データベースは項目をABC順で返すため）
  const canon=x=>Array.isArray(x)?x.map(canon):x&&typeof x==='object'?Object.keys(x).sort().reduce((o,k)=>(o[k]=canon(x[k]),o),{}):x;
  const J=x=>JSON.stringify(canon(x)),clone=x=>x==null?x:JSON.parse(JSON.stringify(x));
  const noV=d=>{if(!d)return d;const c={...d};delete c._v;return c};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  // 自動で作る景品画像は保存しない（各端末で作り直す）
  function stripG(g){g=clone(g);const s=p=>{if(p&&p.img&&(p.autoImg||GIFT_PRESET.has(p.img)))delete p.img};
    (g.prizes||[]).forEach(s);s(g.last);s(g.kiri);if(g.next){(g.next.prizes||[]).forEach(s);s(g.next.last)}return g}
  function rehydrate(g){if(S.isAdmin&&g.next&&g.next.prizes)g.next.prizes.forEach(p=>{if(!p.id)p.id='N'+uid()});const s=(p,rk)=>{if(!p||p.img)return;if(p.autoImg)p.autoImg=false;syncGift(p,rk)};
    (g.prizes||[]).forEach(p=>s(p,p.id));s(g.last,'L');if(g.kiri&&g.kiri.every)s(g.kiri,'K');
    if(g.next){(g.next.prizes||[]).forEach((p,i)=>s(p,String.fromCharCode(65+i)));s(g.next.last,'L')}}
  const ARR=['subs','requests','winners','answers','referrals'];
  function unitOf(k){const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);
    if(c==='users')return db.users[id]&&(id===S.email||S.isAdmin)?db.users[id]:null;
    if(c==='gachas'){const n=db.gachas.findIndex(g=>g.id===id);return n<0?null:{...stripG(db.gachas[n]),ord:n}}
    if(k==='config/main')return {settings:db.settings||null,cases:db.cases||[],lastRoll:db.lastRoll||null,rollLog:db.rollLog||[],added:db.added||[]};
    if(ARR.includes(c))return (db[c]||[]).find(x=>x.id===id)||null;
    return null}
  function keys(){const ks=[];for(const e in db.users)if(e===S.email||S.isAdmin)ks.push('users/'+e);
    db.gachas.forEach(g=>ks.push('gachas/'+g.id));ks.push('config/main');
    (db.answers||[]).forEach(a=>{if(!a.id)a.id=a.sid+'_'+a.at+'_'+uid()});
    ARR.forEach(c=>(db[c]||[]).forEach(x=>ks.push(c+'/'+x.id)));return ks}
  function applyUnit(k,d){const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);d=clone(d);
    if(c==='users'){db.users[id]=d;return}
    if(c==='gachas'){ordOf[id]=d.ord??99;delete d.ord;rehydrate(d);const n=db.gachas.findIndex(g=>g.id===id);if(n>=0)db.gachas[n]=d;else db.gachas.push(d);
      db.gachas.sort((a,b)=>(ordOf[a.id]??99)-(ordOf[b.id]??99));return}
    if(k==='config/main'){if(d.settings)db.settings=d.settings;db.cases=d.cases||[];db.lastRoll=d.lastRoll||null;db.rollLog=d.rollLog||[];db.added=d.added||[];return}
    if(ARR.includes(c)){const a=db[c]||(db[c]=[]);const n=a.findIndex(x=>x.id===id);if(n>=0)a[n]=d;else a.push(d);a.sort((x,y)=>(y.at||0)-(x.at||0))}}
  function removeUnit(k){const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);
    if(c==='users')delete db.users[id];else if(c==='gachas')db.gachas=db.gachas.filter(g=>g.id!==id);
    else if(ARR.includes(c))db[c]=(db[c]||[]).filter(x=>x.id!==id)}
  // 3者マージ：自分が変えたところだけ自分の値。数は差分を足し、一覧は両方の追加分を残す
  const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  const keyOf=x=>x&&typeof x==='object'?(x.uid??x.id??null):null;
  function mergeArr(sv,b,l){
    if(l.concat(sv,b).every(x=>keyOf(x)!=null)){
      // 並び順は自分の端末の順番を守る。サーバーで新しく増えたものは先頭に
      const bm=new Map(b.map(x=>[keyOf(x),J(x)])),sm=new Map(sv.map(x=>[keyOf(x),x])),lk=new Set(l.map(keyOf)),out=[],seen=new Set();
      for(const x of sv){const k=keyOf(x);if(!bm.has(k)&&!lk.has(k)&&!seen.has(k)){out.push(x);seen.add(k)}}
      for(const x of l){const k=keyOf(x);if(seen.has(k))continue;seen.add(k);
        if(!bm.has(k)||J(x)!==bm.get(k))out.push(x);else if(sm.has(k))out.push(sm.get(k))}
      return out}
    const bs=new Set(b.map(x=>J(x)));const nl=l.filter(x=>!bs.has(J(x)));
    return [...nl,...sv].slice(0,Math.max(l.length,sv.length))}
  function mergeVal(sv,b,l){
    if(J(l)===J(b))return sv;if(sv===undefined||J(sv)===J(b))return l;
    if(typeof l==='number'&&typeof sv==='number'&&typeof b==='number')return sv+(l-b);
    if(Array.isArray(l)&&Array.isArray(sv)&&Array.isArray(b))return mergeArr(sv,b,l);
    if(isObj(l)&&isObj(sv)&&isObj(b))return mergeObj(sv,b,l);
    return l}
  function mergeObj(sv,b,l){const r={...sv};const ks=new Set([...Object.keys(l||{}),...Object.keys(b||{})]);
    for(const f of ks){if(f==='_v')continue;const lv=l?l[f]:undefined,bv=b?b[f]:undefined;
      if(J(lv)!==J(bv)){if(lv===undefined)delete r[f];else r[f]=mergeVal(sv[f],bv,lv)}}return r}
  function merge3(sv,b,l){const r=mergeObj(sv,b||{},l);delete r._v;return r}
  function fail(e){console.warn('[sync]',e);const m=e&&(e.code||e.message)||'';
    toast(/permission/i.test(m)?'この操作の権限がありません':'通信できませんでした。電波の良いところでもう一度お試しください')}
  function push(){if(S.state!=='ready')return;
    for(const k of keys()){const u=unitOf(k);if(!u)continue;const s=J(u);if(s!==base[k])write(k,s)}
    if(S.isAdmin)for(const k of Object.keys(base))if(k.startsWith('gachas/')&&!unitOf(k)&&!inflight[k]){delete base[k];delete ver[k];FBX.del(k).catch(fail)}}
  function write(k,s){
    if(inflight[k]){inflight[k]='again';return}
    const isNew=!(k in base),b=isNew?null:JSON.parse(base[k]),sent=JSON.parse(s);
    inflight[k]=true;base[k]=s;
    const p=isNew?(()=>{const d={...sent,_v:1};return FBX.set(k,d).then(()=>d)})()
      :FBX.tx(k,sv=>{const m=sv?merge3(sv,b,sent):{...sent};m._v=((sv&&sv._v)||0)+1;return m});
    p.then(res=>done(k,res,sent)).catch(e=>{inflight[k]=false;if(isNew)delete base[k];else base[k]=J(b);fail(e);
      // 権限がない書き込みは、くり返さずに元へ戻す
      if(/permission/i.test((e&&(e.code||e.message))||'')){if(isNew)removeUnit(k);else applyUnit(k,b);changed();return}
      setTimeout(push,5000)});
  }
  function done(k,res,sent){inflight[k]=false;if(!res)return;
    const m0=noV(res);base[k]=J(m0);ver[k]=res._v||ver[k]||0;
    const loc=unitOf(k);if(loc){const m=merge3(m0,sent,loc);if(J(m)!==J(loc)){applyUnit(k,m);changed()}}
    const h=held[k];delete held[k];if(h&&(h._v||0)>(ver[k]||0))onRemote(k,h);
    const now=unitOf(k);if(now&&J(now)!==base[k])write(k,J(now))}
  function onRemote(k,d){
    if(d){const v=d._v||0;
      if(inflight[k]){if(!held[k]||v>(held[k]._v||0))held[k]=d;return}
      if(v<(ver[k]||0))return;
      const sv=noV(d),s=J(sv);if(s===base[k]){ver[k]=v;return}
      if(!(k in base)&&k.startsWith('winners/')&&S.state==='ready'&&(d.pid==='A'||d.pid==='L')&&Math.abs(now()-(d.at||0))<180000&&!(cur()&&d.name===cur().name&&Draw.lastAt&&Date.now()-Draw.lastAt<60000))setTimeout(()=>bigNews(sv),400);
      const loc=unitOf(k),b=base[k]!=null?JSON.parse(base[k]):null;
      const m=loc&&b?merge3(sv,b,loc):sv;
      base[k]=s;ver[k]=v;applyUnit(k,m);if(J(m)!==s)push();changed();
    }else{if(inflight[k])return;if(!(k in base))return;delete base[k];delete ver[k];removeUnit(k);changed()}}
  function onList(c,list,tag){const seen=new Set();
    list.forEach(({id,data})=>{const k=c+'/'+id;seen.add(k);onRemote(k,data)});
    for(const k of Object.keys(base))if(k.startsWith(c+'/')&&!seen.has(k)&&!inflight[k])onRemote(k,null);
    if(tag)mark(tag)}
  // 画面の更新（入力中・演出中は待つ）
  function busy(){const a=document.activeElement;return !!($('#modalRoot').innerHTML||document.querySelector('.fx')||Draw.on||(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))}
  function changed(){if(S.state!=='ready')return;if(S.isAdmin&&db.gachas.length&&[...ADD_GACHAS,...ADD_CASES].some(d=>!(db.added||[]).includes(d.id))&&'config/main' in base){if(addPresetGachas()){syncAllGifts();push()}else push()}clearTimeout(renderT);renderT=setTimeout(flush,150)}
  function flush(){if(busy()){renderHeader();clearTimeout(renderWait);renderWait=setTimeout(flush,900);return}keepScroll(render)}
  // 読み込み
  const NEED=['admins','gachas','main','me','winners','subs','requests','refs'];
  function mark(t){got.add(t);if(S.state==='loading'&&NEED.every(x=>got.has(x)))finishBoot()}
  function L(u){unsubs.push(u)}
  function start(){stopAll();got.clear();
    L(FBX.watchDoc('config/admins',d=>{S.admins=(d&&d.emails)||[];const was=S.isAdmin;S.isAdmin=S.admins.includes(S.email);
      if(!d&&!S.adminSeen){S.adminSeen=true;FBX.set('config/admins',{emails:[S.email]}).catch(fail)}
      if(d||got.has('admins'))mark('admins');if(was!==S.isAdmin||!S.scoped){S.scoped=true;scope()}if(S.state==='ready'){if(!S.isAdmin&&tab==='admin')tab='gacha';changed()}},fail));
    L(FBX.watchCol('gachas',{},list=>onList('gachas',list,'gachas'),fail));
    L(FBX.watchDoc('config/main',d=>{onRemote('config/main',d);mark('main')},fail));
    L(FBX.watchDoc('users/'+S.email,d=>{onRemote('users/'+S.email,d);mark('me')},fail));
    L(FBX.watchCol('winners',{order:'at',limit:50},list=>onList('winners',list,'winners'),fail));
  }
  // 自分だけ見られるもの／管理者は全員分
  function scope(){scopeUnsubs.forEach(u=>{try{u()}catch(e){}});scopeUnsubs=[];
    const own=S.isAdmin?{}:{eq:['email',S.email]};
    if(S.isAdmin)scopeUnsubs.push(FBX.watchCol('users',{},list=>onList('users',list),fail));
    else for(const k of Object.keys(base))if(k.startsWith('users/')&&k!=='users/'+S.email){delete base[k];delete db.users[k.slice(6)]}
    scopeUnsubs.push(FBX.watchCol('subs',own,list=>onList('subs',list,'subs'),fail));
    scopeUnsubs.push(FBX.watchCol('referrals',S.isAdmin?{}:{eq:['code',refCodeOf(S.email)]},list=>onList('referrals',list,'refs'),fail));
    scopeUnsubs.push(FBX.watchCol('requests',own,list=>onList('requests',list,'requests'),fail));
  }
  function stopAll(){[...unsubs,...scopeUnsubs].forEach(u=>{try{u()}catch(e){}});unsubs=[];scopeUnsubs=[];S.scoped=false}
  function emptyDB(){return {users:{},session:null,gachas:[],requests:[],subs:[],winners:[],answers:[],referrals:[],cases:[],settings:{shipPt:80,freePt:300,target:50},dayOffset:0,lastRoll:null,rollLog:[]}}
  function wipe(){for(const k in base)delete base[k];for(const k in ver)delete ver[k];db=emptyDB()}
  function finishBoot(){
    // 最初の管理者が、ガチャの初期データを用意する
    if(S.isAdmin&&!db.gachas.length&&!('config/main' in base)){
      db.gachas=DEFAULT_GACHAS.map(d=>buildGacha({...d,filled:null}));db.cases=null;migrateCases();
      db.settings={shipPt:80,freePt:300,target:50};db.lastRoll=monthKey(now());db.rollLog=[];db.added=[]}
    if(S.isAdmin&&db.gachas.length){addPresetGachas();syncAllGifts()}
    let u=db.users[S.email],isNew=false;
    if(!u){const p=S.pending||{};isNew=true;
      u=db.users[S.email]=makeUser(p.name||S.email.split('@')[0],S.email,now());addTickets(u,3,'新規登録ボーナス');
      u.consent=p.consent||{terms:now(),share:null};if(p.pref)u.pref=p.pref;if(applyRefOnSignup(u,p.ref))setTimeout(()=>toast(`招待コード特典：チケット${REF.newbie}枚`),2600)}
    u.consent=u.consent||{terms:null,share:null};u.caseConsents=u.caseConsents||{};
    touchLogin(u);S.pending=null;db.session=S.email;S.state='ready';
    if(!S.isAdmin&&tab==='admin')tab='gacha';
    push();render();toast(isNew?'登録ボーナス 3枚を受け取りました':'おかえりなさい、'+u.name+'さん');if(perkToast){const m=perkToast;perkToast='';setTimeout(()=>toast(m),2600)}
  }
  // ガチャを引く：BOXの残り数はサーバーで順番に減らす
  async function drawTx(gid,fn){const k='gachas/'+gid;for(let i=0;inflight[k]&&i<50;i++)await sleep(100);
    inflight[k]=true;let out=null;
    try{const res=await FBX.tx(k,sv=>{if(!sv)return undefined;const g=noV(sv);const ord=g.ord;delete g.ord;out=fn(g);if(!out)return undefined;
        const nd={...stripG(g),ord};nd._v=(sv._v||0)+1;return nd});
      inflight[k]=false;
      if(res){base[k]=J(noV(res));ver[k]=res._v;applyUnit(k,noV(res))}else out=null;
      const h=held[k];delete held[k];if(h&&(h._v||0)>(ver[k]||0))onRemote(k,h);
      return out}
    catch(e){inflight[k]=false;throw e}}
  const AUTH_ERR={'auth/email-already-in-use':'このメールアドレスは登録済みです。「ログイン」から入ってください。','auth/invalid-credential':'メールアドレスかパスワードが違います。',
    'auth/wrong-password':'メールアドレスかパスワードが違います。','auth/user-not-found':'メールアドレスかパスワードが違います。','auth/weak-password':'パスワードは6文字以上にしてください。',
    'auth/invalid-email':'メールアドレスの形が正しくありません。','auth/too-many-requests':'何度も失敗したため、少し時間をおいてからお試しください。',
    'auth/network-request-failed':'通信できませんでした。電波の良いところでお試しください。','auth/operation-not-allowed':'メールでのログインがまだ使えません（管理者の設定待ち）。'};
  const authMsg=e=>AUTH_ERR[e&&e.code]||'うまくいきませんでした（'+((e&&(e.code||e.message))||'不明')+'）';
  function setErr(m){const el=$('#lgErr');if(el)el.textContent=m}
  async function submit(){
    const m=($('#lg-mail')||{}).value?.trim().toLowerCase()||'',pw=($('#lg-pass')||{}).value||'';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){setErr('正しいメールアドレスを入力してください。');return}
    if(pw.length<6){setErr('パスワードは6文字以上です。');return}
    const btn=$('#authForm button[type=submit]');if(btn){btn.disabled=true;btn.textContent='確認しています…'}
    try{
      if(S.mode==='signup'){const n=$('#lg-name').value.trim();
        if(!n){setErr('ニックネームを入力してください。');if(btn){btn.disabled=false;btn.textContent='登録してはじめる'}return}
        if(!$('#lg-agree').checked){setErr('利用規約とプライバシーポリシーへの同意が必要です。');if(btn){btn.disabled=false;btn.textContent='登録してはじめる'}return}
        const pf=($('#lg-pref')||{}).value||'';if(!pf){setErr('お住まいの都道府県を選んでください。');if(btn){btn.disabled=false;btn.textContent='登録してはじめる'}return}
        S.pending={name:n,pref:pf,ref:($('#lg-ref')||{}).value||'',consent:{terms:Date.now(),share:$('#lg-share').checked?Date.now():null}};
        await FBX.signUp(m,pw)}
      else await FBX.signIn(m,pw);
    }catch(e){S.pending=null;setErr(authMsg(e));if(btn){btn.disabled=false;btn.textContent=S.mode==='signup'?'登録してはじめる':'ログイン'}}
  }
  async function reset(){const m=($('#lg-mail')||{}).value?.trim().toLowerCase()||'';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){setErr('先にメールアドレスを入力してから押してください。');return}
    try{await FBX.reset(m);setErr('');toast('パスワード再設定のメールを送りました')}catch(e){setErr(authMsg(e))}}
  function view(){

  const boom=()=>{const cx=W*(.15+Math.random()*.7),cy=H*(.12+Math.random()*.35),c=cols[Math.floor(Math.random()*cols.length)];sfx.pop(Math.floor(Math.random()*4));

    x.globalAlpha=1;requestAnimationFrame(step)};requestAnimationFrame(step)}

/* ---------- prizes / exchange ---------- */
let selected=new Set();
// 景品をガチャ＋賞ごとにまとめる
function groupCount(items){
  const m=new Map();
  items.forEach(p=>{const k=p.gid+'|'+p.pid;m.set(k,(m.get(k)||0)+1)});
  const gi=id=>db.gachas.findIndex(g=>g.id===id);
  return [...m].map(([k,n])=>{const [gid,pid]=k.split('|');return {gid,pid,n}})
    .sort((a,b)=>gi(a.gid)-gi(b.gid)||rankOrder(a.pid)-rankOrder(b.pid));
}
const chip=x=>`<span>${tierDot(x.pid)}${esc(prizeOf(x.gid,x.pid).name)} ×${x.n}</span>`;
const selItems=()=>cur().prizes.filter(p=>selected.has(p.uid)&&p.status==='held');
function shipCalc(items){
  const st=settings();const isD=p=>prizeOf(p.gid,p.pid).digital;
  const phys=items.filter(p=>!isD(p)),dig=items.filter(isD);
  const val=phys.reduce((t,p)=>t+prizeOf(p.gid,p.pid).pt,0);
  const base=!phys.length||val>=st.freePt?0:st.shipPt,k=perkOf(cur()).ship;
  return {phys,dig,val,fee:Math.round(base*k),feeBase:base,perk:base&&k<1?(k?'ランク特典で送料半額':'ランク特典で送料無料'):''};
}
function openExchange(){
  const u=cur();const items=selItems();
  if(!items.length){toast('受け取る景品を選んでください');return}
  const {phys,dig,val,fee,perk}=shipCalc(items),st=settings(),pts=u.points||0,short=fee>pts;
  const prev=db.requests.filter(r=>r.email===u.email&&r.zip)[0]||{};
  openModal(`<h3>景品の受け取り</h3>
    ${dig.length?`<div><b class="small">メールで受け取り（送料なし）</b><div class="summary" style="margin-top:6px">${groupCount(dig).map(chip).join('')}</div><p class="small muted" style="margin-top:4px">${esc(u.email)} にギフトコードを送ります。</p></div>`:''}
    ${phys.length?`<div><b class="small">配送で受け取り</b><div class="summary" style="margin-top:6px">${groupCount(phys).map(chip).join('')}</div>
      <div class="shipbox"><div class="row"><span>送料</span><span class="spacer"></span>${fee?`<b class="num">${fee}pt</b>`:'<b style="color:var(--green)">無料</b>'}</div>${perk?`<p class="small" style="color:var(--green)">${perk}</p>`:''}
      <p class="small muted">${fee?`配送する景品の合計が${st.freePt}pt以上で送料無料です（いま${val}pt、あと${st.freePt-val}pt）。所持ポイント ${pts}pt`:`配送する景品の合計が${st.freePt}pt以上なので送料無料です。`}</p></div></div>`:''}
    ${short?`<p class="err">送料のポイントが${fee-pts}pt足りません。いらない景品をポイントに変換するか、景品をまとめて${st.freePt}pt以上にすると送料無料になります。</p><button class="btn ghost" data-act="close">戻る</button>`:`
    <form class="form" id="exForm">
      ${phys.length?`<label class="f">お名前<input id="ex-name" autocomplete="name" value="${esc(prev.name||u.name)}" required></label>
      <label class="f">郵便番号（ハイフンなし7桁）<input id="ex-zip" inputmode="numeric" autocomplete="postal-code" value="${esc(prev.zip||'')}" placeholder="4540000"></label>
      <label class="f">住所<input id="ex-addr" autocomplete="street-address" value="${esc(prev.addr||'')}" placeholder="愛知県名古屋市中川区…"></label>
      <label class="f">電話番号<input id="ex-tel" inputmode="tel" autocomplete="tel" value="${esc(prev.tel||'')}" placeholder="09012345678"></label>
      <label class="f">備考（任意）<textarea id="ex-note" rows="2"></textarea></label>
      <p class="small muted">ご入力の氏名・住所・電話番号は、景品の発送のためだけに使い、配送事業者に発送を委託します。</p>`:''}
      <div class="err" id="exErr"></div>
      <div class="row"><button type="button" class="btn ghost" data-act="close">戻る</button><span class="spacer"></span><button class="btn green" type="submit">申請する${fee?`（送料${fee}pt）`:''}</button></div>
    </form>`}`);
}
function submitExchange(){
  const u=cur();const items=selItems();const {phys,fee}=shipCalc(items);
  let addr={name:'',zip:'',addr:'',tel:'',note:''};
  if(phys.length){

  }

function ship(rid){

    ${bonus?`<div class="row"><span class="muted">${rankOf(cur().stats.draws).n}特典 +${pc}%</span><span class="spacer"></span><span class="num">+${bonus}pt</span></div>`:''}
    ${evb?`<div class="row"><span class="muted">${esc(ev.name||'イベント')} ${ev.conv}倍</span><span class="spacer"></span><span class="num">+${evb}pt</span></div>`:''}

function toPoints(){
  const u=cur();const items=selItems();
  const base=items.reduce((s,p)=>s+prizeOf(p.gid,p.pid).pt,0),b1=base+Math.floor(base*perkOf(u).conv/100),ev=activeEvent(),sum=b1+(ev&&ev.conv>1?Math.floor(b1*(ev.conv-1)):0);
  items.forEach(p=>p.status='pt');addPoints(u,sum,`景品${items.length}個を変換`);

const monthKey=t=>dkey(t).slice(0,7);
function nextFirst(){const d=new Date(now());return new Date(d.getFullYear(),d.getMonth()+1,1).getTime()}
const nfLabel=()=>{const d=new Date(nextFirst());return (d.getMonth()+1)+'/1'};
const endLabel=()=>{const d=new Date(nextFirst()-86400000);return (d.getMonth()+1)+'/'+d.getDate()};
const daysToNext=()=>Math.max(1,Math.ceil((nextFirst()-now())/86400000));
const STATUS={live:['公開中','ship'],paused:['停止中','req'],draft:['準備中','held'],ended:['終了','done']};
function cloneLineup(g){return {prizes:g.prizes.map(p=>({...p})),last:{...g.last},cost:g.cost,end:false}}
function draftOf(g){if(!g.next)g.next=cloneLineup(g);return g.next}
function hasChange(g){if(!g.next)return false;if(g.next.end)return true;return JSON.stringify(cloneLineup(g))!==JSON.stringify({...g.next,end:false})}
// 予約した内容を反映して新しいBOXを始める
function applyNext(g){
  if(!g.next)return false;
  if(g.next.end){g.status='ended';g.next=null;return true}
  if(g.status==='draft'&&!g.next.prizes.length)return false;
  const wasStarted=g.status!=='draft';
  g.prizes=g.next.prizes.map((p,i)=>({...p,id:String.fromCharCode(65+i)}));
  g.last={...g.next.last};g.cost=g.next.cost;g.next=null;
  if(wasStarted)g.no++;resetBox(g);
  if(g.status==='draft')g.status='live';
  return true;
}
// 月が変わったら（毎月1日）予約内容をまとめて反映
function rollover(){
  const mk=monthKey(now());
  if(!db.lastRoll){db.lastRoll=mk;return 0}
  if(db.lastRoll===mk)return 0;
  let n=0;db.gachas.forEach(g=>{if(applyNext(g))n++});
  db.lastRoll=mk;(db.rollLog=db.rollLog||[]).unshift({month:mk,count:n,at:now()});save();return n;
}
