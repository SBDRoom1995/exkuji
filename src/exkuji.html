          <td class="r" style="white-space:nowrap"><button class="btn small ghost" data-act="pEdit" data-g="${ag.id}" data-m="next" data-k="${i}">編集</button>${i?`<button class="btn small ghost" data-act="pUp" data-g="${ag.id}" data-i="${i}" aria-label="ランクを上げる">↑</button>`:''}<button class="btn small ghost" data-act="pDel" data-g="${ag.id}" data-i="${i}" aria-label="削除">削除</button></td></tr>`}).join('')||`<tr><td colspan="4" class="muted">景品がまだありません。</td></tr>`}
        <tr><td><span class="row" style="flex-wrap:nowrap">${n.last.img?`<span class="thumbw" style="width:36px;height:36px"><img src="${n.last.img}" alt=""></span>`:tierDot('L')}<span>${esc(n.last.name)}<br><span class="small muted">ラストワン賞</span></span></span></td><td class="r">1</td><td class="r">${n.last.pt}</td><td class="r"><button class="btn small ghost" data-act="pEdit" data-g="${ag.id}" data-m="next" data-k="L">編集</button></td></tr>
        <tr><td><b>合計</b></td><td class="r"><b>${tot.toLocaleString()}</b></td><td></td><td></td></tr>
        </tbody></table></div>
        <div class="row" style="margin-top:8px">
          <button class="btn small" data-act="pEdit" data-g="${ag.id}" data-m="next" data-k="new" ${n.prizes.length>=MAX_PRIZES?'disabled':''}>＋ 景品を追加</button>

function adminActs(el){
  const g=G(el.dataset.g);
  return {
    aMode:()=>{adminMode=el.dataset.m;keepScroll(render)},
    gEdit:()=>openGachaEdit(g.id),
    pEdit:()=>openPrizeEdit(g.id,el.dataset.m,el.dataset.k),
    pDel:()=>{draftOf(g).prizes.splice(+el.dataset.i,1);save();keepScroll(render);toast('来月の内容から削除しました')},
    pUp:()=>{const a=draftOf(g).prizes,i=+el.dataset.i;[a[i-1],a[i]]=[a[i],a[i-1]];save();keepScroll(render)},
    gPause:()=>{g.status=g.status==='live'?'paused':'live';save();keepScroll(render);toast(g.status==='live'?'公開を再開しました':'公開を一時停止しました')},
    gRevive:()=>{g.status='draft';g.no++;g.next=cloneLineup(g);adminMode='next';save();render();toast(`内容を確認して、今すぐ公開するか${nfLabel()}まで待ってください`)},
    nextCancel:()=>{g.next=null;save();keepScroll(render);toast('予約を取り消しました')},
    endAsk:()=>confirmBox(`${esc(g.name)}を終了しますか？`,`${endLabel()}まで今のBOXを引けます。${nfLabel()}からは表示されません。BOXが残っていてもラストワン賞は出ません。`,'endSet','終了を予約',true,`data-g="${g.id}"`),
    endSet:()=>{draftOf(g).end=true;closeModal();save();keepScroll(render);toast(`${endLabel()}で終了するよう予約しました`)},
    applyNowAsk:()=>confirmBox('今すぐ反映しますか？',`いまのBOX #${g.no}（残り${gLeft(g).toLocaleString()}個）を終わらせて、新しい内容でBOX #${g.no+1}を始めます。ラストワン賞は出ません。`,'applyNow','今すぐ反映',true,`data-g="${g.id}"`),
    applyNow:()=>{if(g.status==='draft'&&!draftOf(g).prizes.length)return;applyNext(g);adminMode='live';closeModal();save();render();toast(`${g.name}を公開しました`)},
    draftDel:()=>confirmBox(`${esc(g.name)}を削除しますか？`,'まだ公開していないガチャなので、そのまま削除します。','draftDelOk','削除する',true,`data-g="${g.id}"`),
    gDel:()=>{if(db.gachas.length<=1){toast('ガチャが1つだけのときは削除できません');return}
      const held=Object.values(db.users).reduce((n,u)=>n+(u.prizes||[]).filter(p=>p.gid===g.id&&p.status==='held').length,0);
      confirmBox(`${esc(g.name)}を削除しますか？`,`削除すると、このガチャは誰の画面からも消えて、元に戻せません。${held?`<br><b>まだ受け取り申請していない景品が ${held}個</b> あります。削除すると、その景品は名前が分からなくなります。残したい場合は「公開を一時停止」にしてください。`:''}`,'gDelOk','削除する',true,`data-g="${g.id}"`)},
    gDelOk:()=>{db.gachas=db.gachas.filter(x=>x.id!==g.id);if(gsel===g.id)gsel=(db.gachas[0]||{}).id;adminG=db.gachas[0].id;adminMode='live';closeModal();save();render();toast(g.name+'を削除しました')},
    draftDelOk:()=>{db.gachas=db.gachas.filter(x=>x.id!==g.id);adminG=db.gachas[0].id;adminMode='live';closeModal();save();render();toast('削除しました')}
  };
}

/* ---------- modal ---------- */
function openModal(html){$('#modalRoot').innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}

function keepScroll(fn){const y=window.scrollY,sc=[...document.querySelectorAll('.chips,.gsel')].map(e=>e.scrollLeft);fn();window.scrollTo(0,y);document.querySelectorAll('.chips,.gsel').forEach((e,i)=>e.scrollLeft=sc[i]||0)}

/* ---------- render ---------- */
function renderHeader(){
  const u=cur();$('#hdr').hidden=!u;$('#nav').hidden=!u;if(!u)return;
  const ab=document.querySelector('nav.tabs [data-tab=admin]');if(ab){const h=SHARED&&!Sync.isAdmin();ab.style.display=h?'none':'';$('#nav .in').style.gridTemplateColumns=h?'repeat(3,1fr)':''}
  $('#balNum').textContent=u.tickets;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  $('#tDot').hidden=!hasClaimable(u);
  const rk=rankOf(u.stats.draws);$('#rankChip').textContent=rk.n;$('#rankChip').style.setProperty('--rc',rk.c);
  $('#sndBtn').innerHTML=SND?'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>':'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  $('#sndBtn').setAttribute('aria-pressed',SND);
}
function hasClaimable(u){return u.dailyClaimed!==today()||u.scratchPending!=null||(u.streak>=7&&u.streak7Claimed!==u.streakStart)||MISSIONS.some(m=>!u.missions.includes(m.id)&&m.val(u)>=m.goal)}
function render(){
  if(SHARED&&Sync.state()!=='ready'){renderHeader();$('#app').innerHTML=Sync.view()+footerHTML();return}
  if(db){const n=rollover();if(n)setTimeout(()=>toast(`${new Date(now()).getMonth()+1}月の景品に入れ替えました（${n}件）`),50)}
  if(cur())claimReferrals(cur());
  renderHeader();
  const u=cur();const app=$('#app');
  if(!u){app.innerHTML=viewLogin()+footerHTML();return}
  if(!G(gsel)||!live().includes(G(gsel)))gsel=(live()[0]||{}).id;
  app.innerHTML=({gacha:viewGacha,tickets:viewTickets,prizes:viewPrizes,admin:viewAdmin}[tab])(u)+footerHTML();
}
function footerHTML(){return `<footer class="foot">${SHARED&&cur()?'<a href="#" data-act="logout">ログアウト</a>':''}<a href="#" data-act="policy">プライバシーポリシー</a><a href="#" data-act="terms">利用規約</a><a href="#" data-act="terms">特定商取引法に基づく表記</a><span>© 株式会社EXCEED</span><span class="small muted">${window.EX_BUILD||''}</span></footer>`}

      <p class="small muted" style="margin-top:8px">配布ポイント ${sumT}pt（チケット${Math.floor(sumT/PT_PER_TICKET)}枚分）／ チケット1枚あたり報酬 ${sumT?'¥'+Math.round(sumY/sumT*PT_PER_TICKET).toLocaleString():'—'}</p></div>`})()}
    <div class="card"><h2>受け取り申請</h2>
      ${db.requests.length?`<div class="list">${db.requests.map(r=>`<div class="item"><div class="t"><b>${r.id}　${esc(r.name||r.user)}</b><span class="small muted">${r.zip?`〒${esc(r.zip)} ${esc(r.addr)}<br>TEL ${esc(r.tel)}<br>`:''}${esc(r.email)}・送料 ${r.fee?r.fee+'pt':'無料'}<br>${groupCount(r.items).map(x=>{const z=prizeOf(x.gid,x.pid);return esc((G(x.gid)?.name||'')+'：'+z.name)+'×'+x.n+(z.digital?'（メール）':'（配送）')}).join('<br>')}${r.note?'<br>備考：'+esc(r.note):''}</span></div>
        ${r.status==='req'?`<button class="btn small" data-act="ship" data-id="${r.id}">発送済にする</button>`:'<span class="pill ship">発送済</span>'}</div>`).join('')}</div>`:'<p class="muted">申請はまだありません。</p>'}
    </div>
    <div class="card"><h2>会員</h2><div class="list">${users.map(x=>`<div class="item"><div class="t"><b>${esc(x.name)}</b><span class="small muted">${esc(x.email)}・累計${x.stats.draws}回<br>規約同意：${x.consent&&x.consent.terms?fmtT(x.consent.terms):'未記録'}・情報提供の同意：${x.consent&&x.consent.share?fmtT(x.consent.share):'なし'}</span></div><span class="num">${x.tickets}枚・${x.points||0}pt</span>${SHARED?`<button class="btn small ghost" data-act="grantTo" data-email="${esc(x.email)}">+10枚</button>`:''}</div>`).join('')}</div></div>
    ${SHARED?`<div class="card"><h2>自分のアカウント</h2><div class="row"><button class="btn small ghost" data-act="grant">自分に50枚付与</button><button class="btn small ghost" data-act="logout">ログアウト</button></div></div>`:`    <div class="card"><h2>デモ操作</h2><div class="form">
      <div class="row"><button class="btn small ghost" data-act="grant">自分に50枚付与</button><button class="btn small ghost" data-act="nextDay">日付を1日進める</button><button class="btn small ghost" data-act="nextMonth">次の1日まで進める</button><button class="btn small ghost" data-act="logout">ログアウト</button></div>
      <p class="small muted">「日付を1日進める」でデイリー・連続ログイン・広告回数の切り替わりを試せます（現在 ${today()}）。</p>
      <button class="btn small ghost" style="color:var(--danger);border-color:var(--danger);align-self:flex-start" data-act="resetAsk">デモデータを初期化</button>
    </div></div>`}
  </section>`;
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='scrim'){if(e.target===el)closeModal();return}
  if(a==='sel'||a==='ccToggle')return;
  const aa=adminActs(el);if(aa[a]){aa[a]();return}
  const acts={
    goTab:()=>{closeModal();tab=el.dataset.tab;if(SHARED&&tab==='admin'&&!Sync.isAdmin())tab='gacha';render();window.scrollTo(0,0)},
    refShare:()=>{const code=refCodeOf(cur().email),url=location.origin+location.pathname+'?ref='+code,text=`EXくじで遊ぼう！招待コード ${code} で登録するとチケット${REF.newbie}枚もらえるよ`;
      if(navigator.share)navigator.share({title:'EXくじ',text,url}).catch(()=>{});else{try{navigator.clipboard.writeText(text+'\n'+url);toast('招待の文をコピーしました')}catch(e){toast(code)}}},
    evSave:()=>{const v=id=>($(id)||{}).value||'';const e={name:v('#ev-name').trim()||'イベント',conv:+v('#ev-conv')||1,scr:+v('#ev-scr')||1,start:v('#ev-start'),end:v('#ev-end')};
      if(!e.end){toast('終了日を入れてください');return}if(e.conv<=1&&e.scr<=1){toast('倍率を選んでください');return}
      db.settings={...settings(),event:e};save();keepScroll(render);toast('イベントを保存しました')},
    evStop:()=>{const st={...settings()};delete st.event;db.settings=st;save();keepScroll(render);toast('イベントを終了しました')},
    prefSave:()=>{const v=($('#pf-pref')||{}).value;if(!v){toast('都道府県を選んでください');return}const u=cur();u.pref=v;save();closeModal();keepScroll(render);toast('お住まいを '+v+' にしました')},
    prefAsk:()=>openModal(`<h3>お住まいの都道府県</h3><p class="small muted">地域限定の案件を表示するために使います。</p><div class="form">${prefSelect('pf-pref',cur().pref,false)}</div><div class="row" style="margin-top:12px"><button class="btn ghost" data-act="close">やめる</button><span class="spacer"></span><button class="btn" data-act="prefSave">保存</button></div>`),
    areaAll:()=>{document.querySelectorAll('.ce-pref').forEach(x=>x.checked=false)},
    areaReg:()=>{const ps=(REGIONS.find(r=>r[0]===el.dataset.r)||[0,[]])[1];const on=ps.every(p=>document.querySelector(`.ce-pref[value="${p}"]`).checked);ps.forEach(p=>document.querySelector(`.ce-pref[value="${p}"]`).checked=!on)},
    shareCard:openShare,shareDo,
    crAdd:()=>{const v=id=>(($(id)||{}).value||'').trim();const name=v('#cr-name'),code=v('#cr-code').toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(!name||code.length<3){toast('名前と3文字以上のコード（英数字）を入れてください');return}
      const all=settings().creators||[];if(all.some(c=>c.code===code)||Object.values(db.users).some(u=>refCodeOf(u.email)===code)){toast('そのコードは使われています');return}
      db.settings={...settings(),creators:[...all,{code,name,note:v('#cr-note'),at:now()}]};save();keepScroll(render);toast(name+'さんのコードを作りました')},
    crDel:()=>{db.settings={...settings(),creators:(settings().creators||[]).filter(c=>c.code!==el.dataset.code)};save();keepScroll(render);toast('コードを削除しました')},
    crCopy:()=>{const u=refUrl(el.dataset.code);try{navigator.clipboard.writeText(u);toast('URLをコピーしました')}catch(e){toast(u)}},
    authMode:()=>Sync.setMode(el.dataset.m),pwReset:()=>Sync.reset(),reload:()=>location.reload(),
    grantTo:()=>{const x=db.users[el.dataset.email];if(x){addTickets(x,10,'管理者から付与');save();keepScroll(render);toast(x.name+'さんに10枚付与しました')}},
    admAdd:()=>{const e=($('#adm-mail').value||'').trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('メールアドレスを確認してください');return}Sync.addAdmin(e).then(()=>toast(e+' を管理者にしました')).catch(()=>toast('追加できませんでした'))},
    admDel:()=>{const e=el.dataset.email;Sync.delAdmin(e).then(()=>toast(e+' を管理者から外しました')).catch(()=>toast('外せませんでした'))},
    close:closeModal,
    odds:openOdds,
    pickG:()=>{gsel=el.dataset.g;keepScroll(render)},
    adminG:()=>{adminG=el.dataset.g;adminMode='live';keepScroll(render)},
    newGacha:openNewGacha,
    draw:()=>askDraw(+el.dataset.n),
    confirmDraw:()=>doDraw(+el.dataset.n),
    daily:openScratch,scrOk,scrAll:()=>{const c=$('#scr');c&&c._reveal&&c._reveal()},
    snd:()=>{SND=!SND;try{localStorage.setItem('exkuji-snd',SND?'1':'0')}catch(err){}renderHeader();if(SND)sfx.coin()},
    zukanG:()=>{zukanG=el.dataset.g;keepScroll(render)},streak:claimStreak,ad:watchAd,adClaim,
    caseOpen:()=>openSubmit(el.dataset.id),
    installHide:()=>{try{localStorage.setItem('exkuji-install-hide','1')}catch(err){}keepScroll(render)},
    installGo:()=>{if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}},
    caseGo:()=>{const u=cur();if(!(u.consent&&u.consent.share)){closeModal();tab='tickets';render();setTimeout(()=>{const c=$('#cases');c&&c.scrollIntoView()},50);toast('情報提供に同意すると案件を見られます');return}openCaseConsent(el.dataset.id)},
    caseNew:()=>openCaseEdit(null),caseEdit:()=>openCaseEdit(el.dataset.id),
    caseToggle:()=>{const c=CS(el.dataset.id);c.status=c.status==='live'?'paused':'live';save();keepScroll(render);toast(c.status==='live'?'掲載を再開しました':'掲載を停止しました')},
    caseEndAsk:()=>confirmBox('この案件を終了しますか？','ユーザーの一覧から消えます。提出済みの完了報告の承認や、報告用の出力はこれまでどおりできます。','caseEnd','終了する',true,`data-id="${el.dataset.id}"`),
    caseEnd:()=>{CS(el.dataset.id).status='ended';closeModal();save();keepScroll(render);toast('案件を終了しました')},
    caseKind:()=>{caseKind=el.dataset.k;keepScroll(render)},
    caseCat:()=>{caseCat=el.dataset.c;keepScroll(render)},
    caseLink:()=>openCaseConsent(el.dataset.id),
    caseAgree:()=>{const u=cur();u.caseConsents=u.caseConsents||{};u.caseConsents[el.dataset.id]=now();save();openCaseLink(el.dataset.id)},
    shareOn:()=>{const u=cur();u.consent=u.consent||{};u.consent.share=now();save();keepScroll(render);toast('同意しました。案件が表示されます')},
    shareOff:()=>confirmBox('情報提供の同意を取り消しますか？','取り消すと、取引先のアンケート・案件が表示されなくなります。これまでに提供した情報の扱いは、各提供先にお問い合わせください。','shareOffOk','取り消す',true),
    shareOffOk:()=>{const u=cur();u.consent.share=null;closeModal();save();keepScroll(render);toast('同意を取り消しました')},
    policy:()=>{e.preventDefault();openPolicy()},
    terms:()=>{e.preventDefault();openModal(`<h3>利用規約</h3><p class="muted">利用規約は準備中です。弁護士の確認を受けた本文をここに載せます。</p><button class="btn ghost" data-act="close">閉じる</button>`)},
    sampleShot:()=>{const c=CS($('#caseForm').dataset.cid);setPreview(sampleImg(c.kind===S?'回答完了':'登録完了',c.title.slice(0,14)))},
    approve:()=>approve(el.dataset.id),rejectAsk:()=>rejectAsk(el.dataset.id),reject:()=>reject(el.dataset.id,+el.dataset.i),
    zoom:()=>{const s=db.subs.find(x=>x.id===el.dataset.id);openModal(`<img src="${s.img}" alt="提出された画像" style="max-width:100%;border-radius:10px;align-self:center"><button class="btn ghost" data-act="close">閉じる</button>`)},
    csv:showCsv,
    copyCsv:()=>{const box=$('#csvBox');const done=()=>toast('コピーしました');
      try{navigator.clipboard.writeText(box.value).then(done,()=>{box.select();toast('選択しました。長押しでコピーしてください')})}catch(err){box.select();toast('選択しました。長押しでコピーしてください')}},
    survey:()=>openSurvey(el.dataset.id),mission:()=>claimMission(el.dataset.id),
    buy:()=>buyPack(+el.dataset.i),buyConfirm:()=>buyConfirm(+el.dataset.i),
    selAll:()=>{cur().prizes.filter(p=>p.status==='held').forEach(p=>selected.add(p.uid));keepScroll(render)},
    selLow:()=>{selected.clear();cur().prizes.filter(p=>p.status==='held'&&p.pid==='E').forEach(p=>selected.add(p.uid));keepScroll(render)},
    selNone:()=>{selected.clear();keepScroll(render)},
    exchange:openExchange,
    ptConv:askToPoints,toPoints,ptAsk:askPtTicket,ptTicket,ptStep:()=>ptStep(el.dataset.d),ship:()=>ship(el.dataset.id),
    grant:()=>{addTickets(cur(),50,'管理者付与（デモ）');save();render();toast('+50枚 付与しました')},
    winHide:()=>{const x=db.winners.find(w=>w.id===el.dataset.id);if(x){x.hidden=!x.hidden;save();keepScroll(render)}},
    nextMonth:()=>{db.dayOffset=(db.dayOffset||0)+daysToNext();touchLogin(cur());save();render();toast('日付を '+today()+' に進めました')},
    nextDay:()=>{db.dayOffset=(db.dayOffset||0)+1;touchLogin(cur());save();render();toast('日付を '+today()+' に進めました')},
    logout:()=>{if(SHARED){selected.clear();tab='gacha';Sync.signOut();return}db.session=null;selected.clear();tab='gacha';save();render()},
    resetAsk:()=>openModal(`<h3>デモデータを初期化しますか？</h3><p>会員・チケット・景品・申請・追加したガチャがすべて消えます。</p><div class="row"><button class="btn ghost" data-act="close">やめる</button><span class="spacer"></span><button class="btn" style="background:var(--danger);color:#fff" data-act="reset">初期化する</button></div>`),
    reset:()=>{db=fresh();save();selected.clear();tab='gacha';gsel='gift';adminG='gift';closeModal();render();toast('初期化しました')}
  };
  acts[a]&&acts[a]();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='cs-file'){loadImg(el.files&&el.files[0]);return}
  if(el.id==='cc-ok'){$('#cc-go').disabled=!el.checked;return}
  if(el.id==='ce-kind'){const k=el.value;$('#ce-share').value=k===S?SHARE_SURVEY:SHARE_SIGNUP;$('#ce-purpose').value=k===S?'市場調査・商品開発、回答の集計':'成果の確認と報酬の請求';return}
  if(el.id==='pe-img'){peImg=null;const f=el.files&&el.files[0];if(f)resizeImg(f,360,src=>{peImg=src;$('#pe-prev').innerHTML=`<img src="${src}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">`},()=>toast('画像を読み込めませんでした'));return}
  if(el.dataset.act!=='sel')return;
  el.checked?selected.add(el.dataset.uid):selected.delete(el.dataset.uid);
  const n=$('#selN');if(n)n.textContent=selected.size;
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='authForm'){Sync.submit();return}
  if(f.id==='loginForm'){
    const n=$('#lg-name').value.trim(),m=$('#lg-mail').value.trim();
    if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)){$('#lgErr').textContent='ニックネームと正しいメールアドレスを入力してください。';return}
    signIn(n,m,$('#lg-agree').checked,$('#lg-share').checked);
  }else if(f.id==='svForm')submitSurvey(f);
  else if(f.id==='exForm')submitExchange();
  else if(f.id==='caseForm')submitCase(f);
  else if(f.id==='peForm')savePrizeEdit(f);
  else if(f.id==='ceForm')saveCase(f);
  else if(f.id==='kiriForm'){const g=G(f.dataset.g),ev=parseInt($('#kb-every').value,10)||0,nm=$('#kb-name').value.trim();
    if(ev>0&&!nm){toast('キリ番賞の景品名を入れてください');return}
    const old=g.kiri||{};g.kiri={...old,every:Math.max(0,ev),name:nm,cost:Math.max(0,parseInt($('#kb-cost').value,10)||0),pt:Math.max(0,parseInt($('#kb-pt').value,10)||0),digital:$('#kb-dig').checked};
    if(old.name!==nm){g.kiri.autoName=null}syncGift(g.kiri,'K',old.name!==nm);save();keepScroll(render);toast(ev?`${ev}回ごとのキリ番賞を保存しました`:'キリ番賞をなしにしました')}
  else if(f.id==='geForm'){const g=G(f.dataset.g),n=$('#ge-name').value.trim();if(!n){$('#geErr').textContent='ガチャ名を入れてください。';return}
    g.name=n;g.desc=$('#ge-desc').value.trim();g.tone=$('#ge-tone').value;save();closeModal();keepScroll(render);toast('保存しました')}
  else if(f.id==='costForm'){const c=parseInt($('#nc-cost').value,10);if(!(c>=1)){toast('1以上の数字を入れてください');return}draftOf(G(f.dataset.g)).cost=c;save();keepScroll(render);toast(`${nfLabel()}から1回${c}枚にします`)}
  else if(f.id==='shipForm'){const a=parseInt($('#sh-pt').value,10),b=parseInt($('#sh-free').value,10);
    if(!(a>=0)||!(b>=0)){toast('0以上の数字を入れてください');return}
    db.settings={shipPt:a,freePt:b,target:parseInt($('#sh-target').value,10)||50};save();keepScroll(render);toast('設定を保存しました')}
  else if(f.id==='ngForm')addGacha(f);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('g-minrank')){const g=G(t.dataset.g);if(!g)return;g.minRank=+t.value||0;if(!g.minRank)delete g.minRank;save();keepScroll(render);toast(g.minRank?RANKS[g.minRank].n+'以上の限定にしました':'全員が引けるようにしました')}});
document.addEventListener('input',e=>{if(e.target.id==='ce-yen'||e.target.id==='ce-pt')updRate()});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.areas')){setTimeout(()=>{const l=$('#ce-area-lbl');if(l)l.textContent=areaLabel([...document.querySelectorAll('.ce-pref:checked')].map(x=>x.value))},0)}});

if(SHARED)Sync.boot();else{
db=load();
migrateCases();
db.gachas.forEach(g=>{if(!g.kiri)g.kiri=kiriFor(g.id)});
addPresetGachas();
syncAllGifts();save();
// 文字のフォントが読み込めたら、自動で作った画像を描き直す
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const k in BOX_CACHE)delete BOX_CACHE[k];for(const k in GEN_CACHE)delete GEN_CACHE[k];if(db&&db.gachas)syncAllGifts(true);if(!SHARED)save();render()});
if(!SHARED){
if(cur()){touchLogin(cur());save()}
render();
}
</script>
